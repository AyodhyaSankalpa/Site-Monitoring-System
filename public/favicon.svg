<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="pulseFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
    </defs>
    <!-- Rounded Background matching navbar brand icon -->
    <rect width="64" height="64" rx="16" fill="url(#pulseFaviconGrad)" />
    
    <!-- White Pulse Activity Line -->
    <path d="M 8 32 L 20 32 L 26 15 L 34 49 L 41 24 L 46 36 L 49 32 L 56 32" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glowEffect)" />
</svg>
